# Este Build Spec configura a replicação assíncrona do MySQL de GRU para VCP.
# Os DB Systems e os Secrets devem existir antes da execução deste bootstrap.

version: 0.1
component: build
timeoutInSeconds: 1800
shell: bash
failImmediatelyOnError: true

env:
  variables:
    OCI_AUTH_MODE: "resource_principal"

steps:
  - type: Command
    name: "Validar configuração do bootstrap"
    command: |
      set -euo pipefail

      require_variable() {
        local variable_name="$1"

        if [[ -z "${!variable_name:-}" ]]; then
          echo "Erro: ${variable_name} não foi definido pela Build Pipeline." >&2
          return 1
        fi
      }

      require_file() {
        local file_path="$1"

        if [[ ! -f "${file_path}" ]]; then
          echo "Erro: arquivo obrigatório não encontrado: ${file_path}" >&2
          return 1
        fi
      }

      require_command() {
        local command_name="$1"

        if ! command -v "${command_name}" >/dev/null 2>&1; then
          echo "Erro: comando obrigatório não encontrado: ${command_name}" >&2
          return 1
        fi
      }

      require_variable OCI_PRIMARY_SOURCE_DIR
      require_variable COMPARTMENT_ID
      require_variable MYSQL_PRIMARY_DB_SYSTEM_ID
      require_variable MYSQL_SECONDARY_DB_SYSTEM_ID
      require_variable MYSQL_ADMIN_CREDENTIALS_SECRET_ID
      require_variable MYSQL_REPLICATION_CREDENTIALS_SECRET_ID

      BOOTSTRAP_DIR="${OCI_PRIMARY_SOURCE_DIR}/terraform/mysql/bootstrap"

      require_file "${BOOTSTRAP_DIR}/bootstrap.sh"
      require_file "${BOOTSTRAP_DIR}/validate-replication.sh"

      require_command jq
      require_command base64
      require_command python3.11

      echo "Configuração do bootstrap do MySQL validada."

  - type: Command
    name: "Preparar dependência do bootstrap"
    command: |
      set -euo pipefail

      VENV_DIR="${OCI_WORKSPACE_DIR}/mysql-bootstrap-venv"
      python3.11 -m venv "${VENV_DIR}"

      env \
        -u HTTP_PROXY \
        -u HTTPS_PROXY \
        -u ALL_PROXY \
        -u http_proxy \
        -u https_proxy \
        -u all_proxy \
        -u PIP_PROXY \
        -u pip_proxy \
        PIP_CONFIG_FILE=/dev/null \
        "${VENV_DIR}/bin/python" \
        -m pip install \
        --isolated \
        --no-cache-dir \
        --disable-pip-version-check \
        oci-cli==3.87.0 \
        PyMySQL==1.1.2

      "${VENV_DIR}/bin/oci" --version

  - type: Command
    name: "Configurar replicação MySQL"
    timeoutInSeconds: 1500
    command: |
      set -euo pipefail

      cd "${OCI_PRIMARY_SOURCE_DIR}/terraform/mysql/bootstrap"

      export PATH="${OCI_WORKSPACE_DIR}/mysql-bootstrap-venv/bin:${PATH}"
      export PYTHON_BIN="${OCI_WORKSPACE_DIR}/mysql-bootstrap-venv/bin/python"

      echo "Configurando a replicação assíncrona de GRU para VCP..."
      bash ./bootstrap.sh
      echo "Bootstrap da replicação MySQL concluído com sucesso."
