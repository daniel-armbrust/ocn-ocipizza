# Este arquivo define o Build Spec do pipeline de bootstrap da aplicação OCI Pizza.
# Seu objetivo é executar, de forma sequencial, os scripts bootstrap.sh dos serviços
# que precisam de inicialização no OCI DevOps.
# Este pipeline deve ser executado manualmente quando for necessário preparar
# recursos, dependências ou configurações iniciais dos serviços.

version: 0.1
component: build
timeoutInSeconds: 900
shell: bash
failImmediatelyOnError: true

steps:
  - type: Command
    name: "Bootstrap do delivery-service"
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR}/services/delivery-service"
      echo "Executando bootstrap do delivery-service..."
      bash bootstrap.sh

  - type: Command
    name: "Bootstrap do notification-service"
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR}/services/notification-service"
      echo "Executando bootstrap do notification-service..."
      bash bootstrap.sh

  - type: Command
    name: "Bootstrap do order-service"
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR}/services/order-service"
      echo "Executando bootstrap do order-service..."
      bash bootstrap.sh

  - type: Command
    name: "Bootstrap do pizza-service"
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR}/services/pizza-service"
      echo "Executando bootstrap do pizza-service..."
      bash bootstrap.sh

  - type: Command
    name: "Bootstrap do user-service"
    command: |
      set -euo pipefail
      cd "${OCI_PRIMARY_SOURCE_DIR}/services/user-service"
      echo "Executando bootstrap do user-service..."
      bash bootstrap.sh
