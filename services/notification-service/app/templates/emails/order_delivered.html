<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu pedido foi entregue</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f7f3ee; color: #2f241f; font-family: Arial, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #f7f3ee; padding: 24px 12px;">
        <tr><td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 640px; background-color: #ffffff; border-radius: 16px; overflow: hidden;">
                <tr><td style="background-color: #2f7957; padding: 28px 32px; color: #ffffff;">
                    <p style="margin: 0 0 8px; font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">OCI Pizza</p>
                    <h1 style="margin: 0; font-size: 28px; line-height: 1.2;">Pedido entregue!</h1>
                </td></tr>
                <tr><td style="padding: 32px;">
                    <p style="margin: 0 0 16px; font-size: 18px;">Olá, {{ full_name }}!</p>
                    <p style="margin: 0 0 24px; line-height: 1.6;">Seu pedido foi entregue com sucesso. Esperamos que você aproveite cada pedaço!</p>
                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse: collapse;">
                        <tr><td style="padding: 18px; background-color: #e8f4ed; border-radius: 10px;">
                            <p style="margin: 0 0 8px; color: #4d6c5a; font-size: 14px;">Pedido</p>
                            <p style="margin: 0 0 16px; font-size: 18px; font-weight: bold;">#{{ order_id }}</p>
                            <p style="margin: 0 0 8px; color: #4d6c5a; font-size: 14px;">Status</p>
                            <p style="margin: 0; color: #2f7957; font-size: 22px; font-weight: bold;">{{ status_label }}</p>
                        </td></tr>
                    </table>
                    <p style="margin: 28px 0 0; color: #6b5b53; line-height: 1.6;">Atualizado em {{ updated_at }}. Obrigado por escolher a OCI Pizza!</p>
                </td></tr>
            </table>
        </td></tr>
    </table>
</body>
</html>
