<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}OCI Pizza{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', path='/img/pizza-logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  </head>
  <body>
    <header class="site-header" aria-label="Cabecalho principal">
      <a class="brand" href="/" aria-label="OCI Pizza">
        <img src="{{ url_for('static', path='/img/ocipizza-logo-1.png') }}" alt="OCI Pizza">
      </a>

      <nav class="main-nav" aria-label="Navegacao principal">
        <a href="/">Inicio</a>
        <a href="/pizzas">Cardapio</a>
        <a href="/cart">Carrinho</a>
        <a href="/checkout">Checkout</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <span>OCI Pizza</span>
      <span>Aplicacao cloud-native de referencia</span>
    </footer>

    <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
  </body>
</html>
