{% extends "base.html" %}

{% block title %}Página não encontrada | OCI Pizza{% endblock %}

{% block content %}
<section class="http-error-page" aria-labelledby="error-title">
    <div class="container http-error-layout">
        <div class="http-error-art" aria-hidden="true">
            <span class="http-error-code">404</span>
            <img
                src="{{ url_for('static', path='img/pizza-logo.png') }}"
                alt=""
                width="800"
                height="570"
            >
        </div>

        <div class="http-error-copy">
            <span class="eyebrow">Ops, endereço errado</span>
            <h1 id="error-title">Essa página saiu do cardápio.</h1>
            <p>
                Não encontramos o endereço solicitado. Ele pode ter mudado ou
                não estar mais disponível.
            </p>
            <a class="button" href="/pizzas">Voltar ao cardápio</a>
        </div>
    </div>
</section>
{% endblock %}
