{% extends "base.html" %}

{% block title %}OCI Pizza - Checkout{% endblock %}

{% block content %}
<section class="page-band compact-page" aria-labelledby="checkout-title">
  <div class="section-heading">
    <p class="eyebrow">Checkout</p>
    <h1 id="checkout-title">Revise seu pedido</h1>
  </div>

  <div class="notice" role="status">
    <strong>Checkout aguardando itens do carrinho.</strong>
    <span>Quando houver pizzas selecionadas, o fechamento do pedido sera exibido aqui.</span>
  </div>
</section>
{% endblock %}
