# Cria a identidade Kubernetes utilizada pelos Pods do frontend-service.
#
# O token da ServiceAccount não é montado automaticamente porque a aplicação
# não precisa consumir a API Kubernetes. A futura adoção de OKE Workload
# Identity exigirá a revisão desta configuração e do código da aplicação.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-service

  labels:
    app: frontend-service
    app.kubernetes.io/name: frontend-service
    app.kubernetes.io/part-of: ocipizza

automountServiceAccountToken: false
