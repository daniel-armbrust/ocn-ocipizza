# Cria o Deployment base responsável por executar o order-service.
#
# Namespace, imagem, quantidade de réplicas e configurações específicas são
# definidos pelos overlays do Kustomize.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service

  labels:
    app: order-service
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ocipizza
spec:
  replicas: 1

  # Atualiza os Pods gradualmente sem interromper o processamento dos pedidos.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: order-service
      app.kubernetes.io/name: order-service

  template:
    metadata:
      labels:
        app: order-service
        app.kubernetes.io/name: order-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: ocipizza

    spec:
      restartPolicy: Always

      # Identidade Kubernetes utilizada pelo Pod. O token não é montado porque
      # o serviço ainda não consome diretamente a API do Kubernetes.
      serviceAccountName: order-service
      automountServiceAccountToken: false

      # Secret criado previamente no namespace para autenticação no OCIR.
      imagePullSecrets:
        - name: ocir-secret

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: order-service

          # Nome lógico substituído pelo bloco images de cada overlay.
          image: order-service-image
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Importa as configurações não sensíveis geradas pelo overlay.
          envFrom:
            - configMapRef:
                name: order-service-config

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: temporary-files
              mountPath: /tmp

          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          # Mantém os valores didáticos definidos no manifesto de referência.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: temporary-files
          emptyDir: {}
