# Restringe o tráfego de entrada destinado aos Pods do pizza-service.
#
# A política permite conexões na porta 8000 originadas somente de outros Pods
# do mesmo namespace. O tráfego de saída permanece sem restrições nesta etapa.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pizza-service

spec:
  # Aplica esta política somente aos Pods do pizza-service.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pizza-service

  # Apenas o tráfego de entrada é controlado por esta política.
  policyTypes:
    - Ingress

  # Um podSelector vazio, sem namespaceSelector, representa todos os Pods do
  # mesmo namespace do pizza-service.
  ingress:
    - from:
        - podSelector: {}

      # A API FastAPI recebe as requisições na porta TCP 8000.
      ports:
        - port: 8000
          protocol: TCP
