# Restringe o tráfego de entrada destinado aos Pods do chatbot-service.
#
# A política permite conexões na porta 8000 originadas somente de outros Pods
# do mesmo namespace. O tráfego de saída permanece sem restrições nesta etapa.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chatbot-service

spec:
  # Aplica esta política somente aos Pods do chatbot-service.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chatbot-service

  policyTypes:
    - Ingress

  # Um podSelector vazio, sem namespaceSelector, representa todos os Pods do
  # mesmo namespace do chatbot-service.
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8000
          protocol: TCP
