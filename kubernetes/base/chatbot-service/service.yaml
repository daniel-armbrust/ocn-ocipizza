# Cria um Service interno para expor o chatbot-service dentro do cluster.
#
# O Service distribui as conexões recebidas na porta 8000 entre os Pods
# selecionados e não realiza exposição pública direta.

apiVersion: v1
kind: Service
metadata:
  name: chatbot-service

  labels:
    app: chatbot-service
    app.kubernetes.io/name: chatbot-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ocipizza

spec:
  # ClusterIP torna o serviço acessível somente pela rede interna do cluster.
  type: ClusterIP

  # Seleciona os Pods gerenciados pelo Deployment do chatbot-service.
  selector:
    app: chatbot-service
    app.kubernetes.io/name: chatbot-service

  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
