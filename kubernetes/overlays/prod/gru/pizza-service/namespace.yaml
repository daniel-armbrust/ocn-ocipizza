# Cria o namespace compartilhado pelos serviços de produção no OKE de GRU.
# O mesmo nome é utilizado no cluster de VCP, mas cada cluster mantém seu
# próprio recurso Namespace.

apiVersion: v1
kind: Namespace
metadata:
  name: ocipizza-prod

  # Identifica o namespace como parte da aplicação e do ambiente de produção.
  labels:
    app.kubernetes.io/part-of: ocipizza
    ocipizza.com.br/environment: prod
