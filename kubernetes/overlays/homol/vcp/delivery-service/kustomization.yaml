# Customiza a base do delivery-service para homologação no cluster OKE de VCP.
#
# O overlay define namespace, labels, imagem, réplicas e configurações
# específicas sem duplicar os manifests da base.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ocipizza-homol

# O namespace é criado pelo kustomization.yaml agregador regional.
resources:
  - ../../../../base/delivery-service

labels:
  - pairs:
      env: homol
      rel: candidate
    includeSelectors: true

# A imagem permanece armazenada no OCIR de GRU e é consumida pelo OKE de VCP.
images:
  - name: delivery-service-image
    newName: ${REGISTRY}/${OCI_NAMESPACE}/ocipizza/delivery-service
    newTag: ${RELEASE_VERSION}

# Homologação utiliza uma réplica para reduzir o consumo de recursos.
replicas:
  - name: delivery-service
    count: 1

# O hash do ConfigMap provoca rollout quando a configuração é alterada.
configMapGenerator:
  - name: delivery-service-config
    envs:
      - config.env
