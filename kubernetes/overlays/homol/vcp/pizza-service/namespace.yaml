# Cria o namespace compartilhado pelos serviços de homologação no OKE de VCP.
# O mesmo nome é utilizado no cluster de GRU, mas cada cluster mantém seu
# próprio recurso Namespace.

apiVersion: v1
kind: Namespace
metadata:
  name: ocipizza-homol

  # Identifica o namespace como parte da aplicação e do ambiente de homologação.
  labels:
    app.kubernetes.io/part-of: ocipizza
    ocipizza.com.br/environment: homol
