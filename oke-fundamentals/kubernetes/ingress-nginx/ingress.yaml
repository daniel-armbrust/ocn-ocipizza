# Encaminha as requisições do domínio do OCI PIZZA para
# os serviços da aplicação.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: www-ocipizza-com-br
  namespace: ocipizza-services
spec:
  # Classe criada pelo manifesto oficial do ingress-nginx.
  ingressClassName: nginx
  # Usa o frontend como fallback para qualquer requisição sem uma regra
  # específica de host e caminho.
  defaultBackend:
    service:
      name: frontend-service
      port:
        name: http
  rules:
    - host: www.ocipizza.com.br
      http:
        paths:
          # O admin-service atende /admin e os caminhos abaixo dele.
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  name: http

          # O kitchen também pertence ao admin-service, mas possui regras de
          # autorização próprias para usuários da operação da cozinha.
          - path: /kitchen
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  name: http

---

# Expõe as interfaces administrativas dos serviços de
# infraestrutura por hosts dedicados. Todos os Services
# abaixo pertencem ao namespace ocipizza-infra.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infra-ocipizza-com-br
  namespace: ocipizza-infra
spec:
  # Usa a mesma classe do controlador instalado pelo manifesto oficial.
  ingressClassName: nginx
  rules:
    - host: mailpit.ocipizza.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port:
                  name: http

    - host: rabbitmq.ocipizza.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  name: management

    - host: objectstorage.ocipizza.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: objectstorage
                port:
                  name: console
