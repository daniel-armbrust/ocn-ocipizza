# Encaminha as requisições do domínio do OCI PIZZA para os serviços da
# aplicação.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: www-ocipizza-com-br
  namespace: ocipizza-services
spec:
  # Classe criada pelo manifesto oficial do ingress-nginx.
  ingressClassName: nginx
  rules:
    - host: www.ocipizza.com.br
      http:
        paths:
          # O admin-service atende /admin e os caminhos abaixo dele.
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 8000

          # O kitchen também pertence ao admin-service, mas possui regras de
          # autorização próprias para usuários da operação da cozinha.
          - path: /kitchen
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 8000

          # Qualquer outro caminho é encaminhado ao frontend-service.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 8000
