# Cria um Deployment para executar o admin-service no OKE.
# Mantém duas réplicas do admin-service em execução e recria os Pods
# automaticamente caso algum seja excluído ou apresente falha.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: ocipizza-services
spec:
  # Define a quantidade desejada de Pods em execução.
  replicas: 2

  # Atualiza os Pods gradualmente, mantendo a disponibilidade
  # do admin-service durante a substituição das instâncias.
  strategy:
    type: RollingUpdate

  # Seleciona os Pods que possuem os labels abaixo.
  selector:
    matchLabels:
      app: admin-service
      rel: beta
      env: development

  # Define como os Pods do admin-service devem ser criados.
  template:
    metadata:
      labels:
        app: admin-service
        rel: beta
        env: development
    spec:
      # Mantém o Pod em execução, conforme exigido pelo Deployment.
      restartPolicy: Always

      # Credenciais para baixar imagens privadas do OCIR.
      imagePullSecrets:
        - name: ocir-secret

      containers:
        - name: admin-service

          # Imagem Docker do admin-service publicada no OCIR.
          image: ${REGISTRY}/${OCI_NAMESPACE}/ocipizza/admin-service:1.0.0
          
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Verifica se o processo FastAPI continua respondendo.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

          # Define os recursos mínimos solicitados e os limites máximos
          # de CPU e memória do container.
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "258Mi"

          env:
            - name: APP_ENV
              value: "development"

            - name: LOG_LEVEL
              value: "INFO"

            - name: OCI_REGION
              value: "sa-saopaulo-1"

            - name: REDIS_ENDPOINT
              value: "redis://redis.ocipizza-infra.svc.cluster.local:6379/1"

            - name: SESSION_SECRET_KEY
              value: "!!!Sup3rS3cr3t0!!!"

            - name: CSRF_SECRET_KEY
              value: "!!!Sup3rS3cr3t0!!!"

            - name: PIZZA_SERVICE_URL
              value: "http://pizza-service.ocipizza-services.svc.cluster.local:8000"

            - name: USER_SERVICE_URL
              value: "http://user-service.ocipizza-services.svc.cluster.local:8000"

            - name: DELIVERY_SERVICE_URL
              value: "http://delivery-service.ocipizza-services.svc.cluster.local:8000"

            - name: ORDER_SERVICE_URL
              value: "http://order-service.ocipizza-services.svc.cluster.local:8000"

            - name: JWT_ISSUER
              value: "user-service"

            - name: JWT_AUDIENCE
              value: "ocipizza"

            - name: JWT_JWKS_URL
              value: "http://user-service.ocipizza-services.svc.cluster.local:8000/.well-known/jwks.json"

            - name: OBJECTSTORAGE_ENDPOINT
              value: "http://objectstorage.ocipizza-infra.svc.cluster.local:9000"

            - name: OBJECTSTORAGE_ACCESS_KEY
              value: "minioadmin"

            - name: OBJECTSTORAGE_SECRET_KEY
              value: "minioadmin"

            - name: PIZZA_IMAGES_OBJECTSTORAGE_BUCKET
              value: "pizza-images"
