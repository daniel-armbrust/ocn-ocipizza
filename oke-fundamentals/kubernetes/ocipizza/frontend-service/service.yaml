# Expõe o frontend-service internamente e por meio 
# de uma porta dos worker nodes (Permite utilizar diferentes
# Ingress Controllers).

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ocipizza-services
spec:
  # O OCI Native Ingress Controller exige NodePort nos Services de backend.
  type: NodePort

  # Seleciona os Pods gerenciados pelo frontend-service.
  selector:
    app: frontend-service
    rel: beta
    env: development

  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
      nodePort: 30070
