# Cria um Service interno para expor o frontend-service dentro do cluster.
# O Service seleciona os Pods do frontend-service e encaminha as conexões
# recebidas na porta 80 para a porta HTTP da aplicação.

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ocipizza-services
spec:
  # O acesso externo ocorre pelo ingress-nginx.
  type: ClusterIP

  # Seleciona os Pods gerenciados pelo frontend-service.
  selector:
    app: frontend-service
    rel: beta
    env: development

  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
