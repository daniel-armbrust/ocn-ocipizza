# Cria um Deployment para executar o order-service no OKE.
# Mantém duas réplicas do order-service em execução e recria os Pods
# automaticamente caso algum seja excluído ou apresente falha.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ocipizza-services
spec:
  # Define a quantidade desejada de Pods em execução.
  replicas: 2

  # Atualiza os Pods gradualmente, mantendo a disponibilidade
  # do order-service durante a substituição das instâncias.
  strategy:
    type: RollingUpdate

  # Seleciona os Pods que possuem os labels abaixo.
  selector:
    matchLabels:
      app: order-service
      rel: beta
      env: development

  # Define como os Pods do order-service devem ser criados.
  template:
    metadata:
      labels:
        app: order-service
        rel: beta
        env: development
    spec:
      # Mantém o Pod em execução, conforme exigido pelo Deployment.
      restartPolicy: Always

      # Credenciais para baixar imagens privadas do OCIR.
      imagePullSecrets:
        - name: ocir-secret

      containers:
        - name: order-service

          # Imagem Docker do order-service publicada no OCIR.
          image: ${REGISTRY}/${OCI_NAMESPACE}/ocipizza/order-service:1.0.0

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Verifica se o processo FastAPI continua respondendo.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

          # Define os recursos mínimos solicitados e os limites máximos
          # de CPU e memória do container.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          env:
            - name: APP_ENV
              value: "development"

            - name: LOG_LEVEL
              value: "INFO"

            - name: OCI_REGION
              value: "sa-saopaulo-1"

            - name: PERSISTENCE_PROVIDER
              value: "nosql"

            - name: NOSQL_PROVIDER
              value: "local"

            - name: NOSQL_ENDPOINT
              value: "http://nosql.ocipizza-infra.svc.cluster.local:8080"

            - name: NOSQL_TABLE_NAME
              value: "orders"

            - name: MESSAGING_PROVIDER
              value: "rabbitmq"

            - name: QUEUE_NAME
              value: "notifications-queue"

            - name: RABBITMQ_HOST
              value: "rabbitmq.ocipizza-infra.svc.cluster.local"

            - name: RABBITMQ_PORT
              value: "5672"

            - name: RABBITMQ_USERNAME
              value: "oci_pizza"

            - name: RABBITMQ_PASSWORD
              value: "oci_pizza"

            - name: JWT_ISSUER
              value: "user-service"

            - name: JWT_AUDIENCE
              value: "ocipizza"

            - name: JWT_JWKS_URL
              value: "http://user-service.ocipizza-services.svc.cluster.local:8000/.well-known/jwks.json"
