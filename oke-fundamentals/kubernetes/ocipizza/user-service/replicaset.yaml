# Cria um ReplicaSet para executar o user-service no OKE.
# Mantém duas réplicas do user-service em execução e recria os Pods
# automaticamente caso algum seja excluído ou apresente falha.
# Utiliza os serviços locais de MySQL e RabbitMQ do laboratório.
# Este recurso é utilizado para estudar ReplicaSets no Kubernetes.

apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: user-service
  namespace: ocipizza-services
spec:
  # Define a quantidade desejada de Pods em execução.
  replicas: 3

  # Seleciona os Pods que possuem os labels abaixo:
  selector:
    matchLabels:
      app: user-service
      rel: beta
      env: development

  # Define como os Pods devem ser criados.
  template:
    metadata:
      labels:
        app: user-service
        rel: beta
        env: development
    spec:
      # Credenciais para baixar imagens privadas do OCIR.
      imagePullSecrets:
        - name: ocir-secret

      containers:
        - name: user-service

          # Imagem Docker do user-service publicada no OCIR.
          image: ${REGISTRY}/${OCI_NAMESPACE}/ocipizza/user-service:1.0.0

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Verifica se o processo FastAPI continua respondendo.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

          # Monta cada chave separadamente para não tornar /run/secrets somente
          # leitura e bloquear o volume automático do ServiceAccount.
          volumeMounts:
            - name: jwt-keys
              mountPath: /run/secrets/jwt_private_key.pem
              subPath: jwt_private_key.pem
              readOnly: true

            - name: jwt-keys
              mountPath: /run/secrets/jwt_public_key.pem
              subPath: jwt_public_key.pem
              readOnly: true

          env:
            - name: APP_ENV
              value: "development"

            - name: OCI_REGION
              value: "sa-saopaulo-1"

            - name: LOG_LEVEL
              value: "INFO"

            - name: PERSISTENCE_PROVIDER
              value: "sqlalchemy"

            - name: DATABASE_URL
              value: "mysql+pymysql://user_service:user_service@mysql.ocipizza-infra.svc.cluster.local:3306/users"

            - name: MESSAGING_PROVIDER
              value: "rabbitmq"

            - name: QUEUE_NAME
              value: "notifications-queue"

            - name: RABBITMQ_HOST
              value: "rabbitmq.ocipizza-infra.svc.cluster.local"

            - name: RABBITMQ_PORT
              value: "5672"

            - name: RABBITMQ_USERNAME
              value: "oci_pizza"

            - name: RABBITMQ_PASSWORD
              value: "oci_pizza"

            - name: JWT_KEY_PROVIDER
              value: "local"

            - name: JWT_ISSUER
              value: "user-service"

            - name: JWT_AUDIENCE
              value: "ocipizza"

            - name: JWT_ACCESS_TOKEN_EXPIRATION_MINUTES
              value: "15"

            - name: JWT_PRIVATE_KEY_PATH
              value: "/run/secrets/jwt_private_key.pem"

            - name: JWT_PUBLIC_KEY_PATH
              value: "/run/secrets/jwt_public_key.pem"

            - name: REFRESH_TOKEN_EXPIRATION_DAYS
              value: "30"

      # Disponibiliza as chaves JWT armazenadas no Kubernetes Secret.
      volumes:
        - name: jwt-keys
          secret:
            secretName: user-service-jwt
