# Cria um Pod Kubernetes para executar o delivery-service no OKE.
# O serviço é responsável por consultar a disponibilidade de entrega,
# calcular taxas e informar prazos estimados com base no CEP.
# Este manifesto utiliza configurações locais para o laboratório,
# sem depender de serviços gerenciados da OCI.

apiVersion: v1
kind: Pod
metadata:
  name: delivery-service
  labels:
    app: delivery-service
    rel: beta
    env: development
  namespace: ocipizza-services
spec:
  # Mantém o Pod em execução continuamente.
  restartPolicy: Always

  # Credenciais para baixar imagens privadas do OCIR.
  imagePullSecrets:
    - name: ocir-secret

  containers:
    - name: delivery-service

      # Imagem Docker do delivery-service publicada no OCIR.
      image: ${REGISTRY}/${OCI_NAMESPACE}/ocipizza/delivery-service:1.0.0

      ports:
        - name: http
          containerPort: 8000
          protocol: TCP

      # Verifica se o processo FastAPI continua respondendo.
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
        successThreshold: 1

      # Define os recursos mínimos solicitados e os limites máximos
      # de CPU e memória do container.
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "250m"
          memory: "256Mi"

      env:
        - name: APP_ENV
          value: "development"
        
        - name: LOG_LEVEL
          value: "INFO"

        - name: OCI_REGION
          value: "sa-saopaulo-1"
        
        - name: PERSISTENCE_PROVIDER
          value: "nosql"
        
        - name: NOSQL_PROVIDER
          value: "local"
        
        - name: NOSQL_ENDPOINT
          value: "http://nosql.ocipizza-infra.svc.cluster.local:8080"

        - name: NOSQL_TABLE_NAME
          value: "delivery_areas"

        - name: JWT_ISSUER
          value: "user-service"

        - name: JWT_AUDIENCE
          value: "ocipizza"

        - name: JWT_JWKS_URL
          value: "http://user-service.ocipizza-services.svc.cluster.local:8000/.well-known/jwks.json"
