# Cria um Pod Kubernetes para executar o RabbitMQ no OKE.
# O RabbitMQ fornece mensageria assíncrona para os microsserviços
# do OCI Pizza, utilizando o protocolo AMQP.
# Mantém a mesma imagem, credenciais e verificação de saúde do Docker Compose.
# Utiliza um OCI Block Volume para preservar filas e mensagens.
# Este Pod é destinado exclusivamente ao laboratório de desenvolvimento.

apiVersion: v1
kind: Pod
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
    rel: stable
    env: development
  namespace: ocipizza-infra
spec:
  # Mantém o Pod em execução continuamente.
  restartPolicy: Always

  containers:
    - name: rabbitmq
      image: docker.io/library/rabbitmq:4.1.4-management

      ports:
        # Porta utilizada pelos clientes AMQP.
        - name: amqp
          containerPort: 5672
          protocol: TCP

        # Interface web de administração do RabbitMQ.
        - name: management
          containerPort: 15672
          protocol: TCP

      env:
        - name: RABBITMQ_DEFAULT_USER
          value: "oci_pizza"

        - name: RABBITMQ_DEFAULT_PASS
          value: "oci_pizza"

      # Verifica se o processo RabbitMQ está em execução.
      livenessProbe:
        exec:
          command:
            - rabbitmq-diagnostics
            - check_running
        initialDelaySeconds: 20
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 10

      # Libera o Pod quando os listeners do RabbitMQ aceitarem conexões.
      readinessProbe:
        exec:
          command:
            - rabbitmq-diagnostics
            - check_port_connectivity
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 6

      # Define os recursos mínimos solicitados e os limites máximos
      # de CPU e memória do container.
      resources:
        requests:
          cpu: "100m"
          memory: "512Mi"
        limits:
          cpu: "500m"
          memory: "768Mi"

      # Monta o volume no diretório de dados utilizado pelo RabbitMQ.
      volumeMounts:
        - name: rabbitmq-data
          mountPath: /var/lib/rabbitmq

  # Preserva filas, mensagens e metadados quando o Pod for recriado.
  volumes:
    - name: rabbitmq-data
      persistentVolumeClaim:
        claimName: rabbitmq-pvc
