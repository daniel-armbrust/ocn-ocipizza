# Cria um Service interno para disponibilizar o Mailpit aos microsserviços.
# O Service encaminha as conexões SMTP na porta 1025 e disponibiliza a
# interface web na porta 8025. O tipo NodePort é necessário para que o OCI
# Native Ingress Controller possa encaminhar tráfego para este Service.

apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: ocipizza-infra
spec:
  # O OCI Native Ingress Controller exige NodePort nos Services de backend.
  type: NodePort

  # Seleciona o Pod gerenciado pelo controlador do Mailpit.
  selector:
    app: mailpit
    rel: stable
    env: development

  ports:
    # Porta utilizada pelos microsserviços para envio SMTP.
    - name: smtp
      port: 1025
      targetPort: smtp
      protocol: TCP

    # Porta utilizada pela interface web do Mailpit.
    - name: http
      port: 8025
      targetPort: http
      protocol: TCP
