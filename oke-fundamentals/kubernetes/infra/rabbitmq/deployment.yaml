# Cria um Deployment para executar o RabbitMQ no OKE.
# Mantém uma réplica do RabbitMQ em execução e recria o Pod automaticamente
# caso ele seja excluído ou apresente falha.
# Utiliza um PersistentVolumeClaim para armazenar filas e mensagens.
# Este recurso é utilizado para estudar Deployments no Kubernetes.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: ocipizza-infra
spec:
  # Mantém apenas uma réplica porque o volume utiliza ReadWriteOnce.
  replicas: 1

  # Encerra o Pod atual antes de criar o substituto, evitando conflitos
  # com volumes ReadWriteOnce e mantendo o laboratório previsível.
  strategy:
    type: Recreate

  # Seleciona os Pods que possuem os labels abaixo.
  selector:
    matchLabels:
      app: rabbitmq
      rel: stable
      env: development

  # Define como o Pod do RabbitMQ deve ser criado.
  template:
    metadata:
      labels:
        app: rabbitmq
        rel: stable
        env: development
    spec:
      # Mantém o Pod em execução, conforme exigido pelo Deployment.
      restartPolicy: Always

      containers:
        - name: rabbitmq
          image: docker.io/library/rabbitmq:4.1.4-management

          ports:
            # Porta utilizada pelos clientes AMQP.
            - name: amqp
              containerPort: 5672
              protocol: TCP

            # Interface web de administração do RabbitMQ.
            - name: management
              containerPort: 15672
              protocol: TCP

          env:
            # Credenciais utilizadas somente no laboratório de desenvolvimento.
            - name: RABBITMQ_DEFAULT_USER
              value: "oci_pizza"

            - name: RABBITMQ_DEFAULT_PASS
              value: "oci_pizza"

          # Verifica se o processo RabbitMQ está em execução.
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - check_running
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

          # Libera o Pod quando os listeners aceitarem conexões.
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - check_port_connectivity
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6

          # Define os recursos mínimos solicitados e os limites máximos
          # de CPU e memória do container.
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"

          # Monta o volume no diretório de dados utilizado pelo RabbitMQ.
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq

      # Preserva filas, mensagens e metadados quando o Pod for recriado.
      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-pvc
