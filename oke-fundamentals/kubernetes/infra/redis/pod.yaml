# Cria um Pod Kubernetes para executar o Redis no OKE.
# O Redis fornece armazenamento em memória para as sessões
# utilizadas pelo frontend-service do OCI Pizza.
# Mantém a mesma imagem e configuração do Docker Compose,
# sem persistência em disco e com verificação de saúde.
# Este Pod é destinado exclusivamente ao laboratório de desenvolvimento.

apiVersion: v1
kind: Pod
metadata:
  name: redis
  labels:
    app: redis
    rel: stable
    env: development
  namespace: ocipizza-infra
spec:
  # Mantém o Pod em execução continuamente.
  restartPolicy: Always

  containers:
    - name: redis
      image: docker.io/library/redis:7.0

      # Inicializa o Redis sem persistência em disco.
      command:
        - redis-server

      args:
        - --appendonly
        - "no"
        - --save
        - ""

      ports:
        # Porta utilizada pelos clientes Redis.
        - name: redis
          containerPort: 6379
          protocol: TCP

      # Verifica se o Redis está aceitando conexões na porta padrão.
      livenessProbe:
        tcpSocket:
          port: redis
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 10

      # Libera o Pod para receber conexões quando a porta estiver disponível.
      readinessProbe:
        tcpSocket:
          port: redis
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 6

      # Define os recursos mínimos solicitados e os limites máximos
      # de CPU e memória do container.
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "250m"
          memory: "256Mi"
