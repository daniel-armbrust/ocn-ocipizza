# Cria um ReplicationController para executar o Redis no OKE.
# Mantém uma réplica do Redis em execução e recria o Pod automaticamente
# caso ele seja excluído ou apresente falha.
# Os dados de sessão são temporários e não utilizam armazenamento persistente.
# Este recurso é utilizado para estudar ReplicationControllers no Kubernetes.

apiVersion: v1
kind: ReplicationController
metadata:
  name: redis
  namespace: ocipizza-infra
spec:
  # Mantém uma única instância para o armazenamento temporário de sessões.
  replicas: 1

  # Seleciona os Pods que possuem os labels abaixo.
  selector:
    app: redis
    rel: stable
    env: development

  # Define como o Pod do Redis deve ser criado.
  template:
    metadata:
      labels:
        app: redis
        rel: stable
        env: development
    spec:
      # Mantém o Pod em execução, conforme exigido pelo ReplicationController.
      restartPolicy: Always

      containers:
        - name: redis
          image: docker.io/library/redis:7.0

          # Inicializa o Redis sem persistência em disco.
          command:
            - redis-server

          args:
            - --appendonly
            - "no"
            - --save
            - ""

          ports:
            # Porta utilizada pelos clientes Redis.
            - name: redis
              containerPort: 6379
              protocol: TCP

          # Verifica se o Redis continua aceitando conexões na porta padrão.
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10

          # Libera o Pod quando a porta estiver disponível para conexões.
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          # Define os recursos mínimos solicitados e os limites máximos
          # de CPU e memória do container.
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
