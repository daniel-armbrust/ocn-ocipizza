# Cria um Deployment para executar o Mailpit no OKE.
# Mantém uma réplica do Mailpit em execução e recria o Pod automaticamente
# caso ele seja excluído ou apresente falha.
# Utiliza um PersistentVolumeClaim para armazenar os e-mails capturados.
# Este recurso é utilizado para estudar Deployments no Kubernetes.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: ocipizza-infra
spec:
  # Mantém apenas uma réplica porque o volume utiliza ReadWriteOnce.
  replicas: 1

  # Atualiza os Pods gradualmente, mantendo a disponibilidade
  # do Mailpit durante a substituição das instâncias.
  strategy:
    type: RollingUpdate

  # Seleciona os Pods que possuem os labels abaixo.
  selector:
    matchLabels:
      app: mailpit
      rel: stable
      env: development

  # Define como o Pod do Mailpit deve ser criado.
  template:
    metadata:
      labels:
        app: mailpit
        rel: stable
        env: development
    spec:
      # Mantém o Pod em execução, conforme exigido pelo Deployment.
      restartPolicy: Always

      containers:
        - name: mailpit
          image: docker.io/axllent/mailpit:latest

          ports:
            # Porta utilizada pelos microsserviços para envio SMTP.
            - name: smtp
              containerPort: 1025
              protocol: TCP

            # Porta utilizada pela interface web do Mailpit.
            - name: http
              containerPort: 8025
              protocol: TCP

          # Verifica se a interface web continua aceitando conexões TCP.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          # Libera o Pod para receber tráfego quando o Mailpit estiver pronto.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          # Define os recursos mínimos solicitados e os limites máximos 
          # de CPU e memória do container.
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"

          # Monta o volume no diretório de dados do Mailpit.
          volumeMounts:
            - name: mailpit-data
              mountPath: /data

          env:
            # Limita a quantidade de mensagens mantidas no laboratório.
            - name: MP_MAX_MESSAGES
              value: "5000"

            # Armazena as mensagens no banco persistente do Mailpit.
            - name: MP_DATABASE
              value: "/data/mailpit.db"

      volumes:
        - name: mailpit-data
          persistentVolumeClaim:
            claimName: mailpit-pvc
