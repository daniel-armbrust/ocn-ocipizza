# Cria um Pod Kubernetes para executar o delivery-service no OKE.
# O serviço é responsável por consultar a disponibilidade de entrega,
# calcular taxas e informar prazos estimados com base no CEP.
# Este manifesto utiliza configurações locais para o laboratório,
# sem depender de serviços gerenciados da OCI.

apiVersion: v1
kind: Pod
metadata:
  name: delivery-service
  labels:
    app: delivery-service
    rel: beta
    env: development
  namespace: ocipizza-services
spec:
  containers:
    - name: delivery-service

      # Imagem Docker do delivery-service publicada no OCIR.
      image: ${REGISTRY}/${OCI_NAMESPACE}/ocipizza/delivery-service:1.0.0

      ports:
        - name: http
          containerPort: 8000
          protocol: TCP

      env:
        - name: APP_ENV
          value: "development"
        
        - name: LOG_LEVEL
          value: "INFO"

        - name: OCI_REGION
          value: "sa-saopaulo-1"
        
        - name: PERSISTENCE_PROVIDER
          value: "nosql"
        
        - name: NOSQL_PROVIDER
          value: "local"
        
        - name: NOSQL_ENDPOINT
          value: "http://nosql.ocipizza-infra.svc.cluster.local:8080"

        - name: NOSQL_TABLE_NAME
          value: "delivery_areas"

        - name: JWT_ISSUER
          value: "user-service"

        - name: JWT_AUDIENCE
          value: "ocipizza"

        - name: JWT_JWKS_URL
          value: "http://user-service.ocipizza.svc.cluster.local:8000/.well-known/jwks.json"
