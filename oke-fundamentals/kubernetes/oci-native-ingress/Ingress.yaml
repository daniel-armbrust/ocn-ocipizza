# Regras de roteamento do OCI PIZZA usando o OCI Native Ingress Controller.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: www-ocipizza-com-br
  namespace: ocipizza-services
  annotations:
    # Consolida os backends do frontend e do admin em um listener HTTP público na porta 80.
    oci-native-ingress.oraclecloud.com/http-listener-port: "80"

    # Distribui novas conexões para o backend menos ocupado.
    oci-native-ingress.oraclecloud.com/policy: "LEAST_CONNECTIONS"

    # Define o tempo máximo de inatividade da conexão.
    oci-native-ingress.oraclecloud.com/listener-connection-idle-timeout: "60"

    # Configura as verificações de saúde dos backends.
    oci-native-ingress.oraclecloud.com/healthcheck-interval-milliseconds: "10000"
    oci-native-ingress.oraclecloud.com/healthcheck-timeout-milliseconds: "3000"
    oci-native-ingress.oraclecloud.com/healthcheck-retries: "3"
spec:
  ingressClassName: ocipizza-native-ingress

  # O frontend atende as requisições que não correspondem a /admin ou /kitchen.
  defaultBackend:
    service:
      name: frontend-service
      port:
        name: http

  rules:
    - host: www.ocipizza.com.br
      http:
        paths:
          # O admin-service atende a área administrativa.
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  name: http

          # O mesmo serviço atende a operação da cozinha.
          - path: /kitchen
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  name: http

---

# Interfaces administrativas dos serviços de infraestrutura.
# Os Services abaixo pertencem ao namespace ocipizza-infra.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infra-ocipizza-com-br
  namespace: ocipizza-infra
  annotations:
    # Usa o mesmo listener HTTP público na porta 80 para todas as interfaces de infraestrutura.
    # O host recebido define qual backend será utilizado.
    oci-native-ingress.oraclecloud.com/http-listener-port: "80"

    # Aplica aos backends das interfaces de infraestrutura.
    oci-native-ingress.oraclecloud.com/policy: "LEAST_CONNECTIONS"
    oci-native-ingress.oraclecloud.com/listener-connection-idle-timeout: "60"
    oci-native-ingress.oraclecloud.com/healthcheck-interval-milliseconds: "10000"
    oci-native-ingress.oraclecloud.com/healthcheck-timeout-milliseconds: "3000"
    oci-native-ingress.oraclecloud.com/healthcheck-retries: "3"
spec:
  ingressClassName: ocipizza-native-ingress
  rules:
    - host: mailpit.ocipizza.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port:
                  name: http

    - host: rabbitmq.ocipizza.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  name: management

    - host: objectstorage.ocipizza.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: objectstorage
                port:
                  name: console
