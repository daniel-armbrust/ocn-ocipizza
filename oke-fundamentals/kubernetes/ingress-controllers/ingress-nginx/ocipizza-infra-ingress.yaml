# Expõe as interfaces administrativas dos serviços de infraestrutura por
# hosts dedicados. Todos os Services abaixo pertencem ao namespace ocipizza-infra.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infra-ocipizza-com-br
  namespace: ocipizza-infra
spec:
  # Usa a mesma classe do controlador instalado pelo manifesto oficial.
  ingressClassName: nginx

  rules:
    - host: mailpit.ocipizza.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port:
                  name: http

    - host: rabbitmq.ocipizza.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  name: management

    - host: objectstorage.ocipizza.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: objectstorage
                port:
                  name: console
