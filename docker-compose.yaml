services:

  # Microserviço responsável pelo gerenciamento do catálogo 
  # de pizzas.
  pizza-service:
    container_name: ocipizza-pizza-service
    build:
      context: ./services/pizza-service
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    networks:
      - ocipizza-network
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO

      PERSISTENCE_PROVIDER: nosql

      NOSQL_ENDPOINT: http://nosql:8080
      NOSQL_TABLE_NAME: pizzas

      OBJECTSTORAGE_ENDPOINT: http://object-storage:9000
      OBJECTSTORAGE_BUCKET: pizza-images
      OBJECTSTORAGE_ACCESS_KEY: minioadmin
      OBJECTSTORAGE_SECRET_KEY: minioadmin

      JWT_ISSUER: user-service
      JWT_AUDIENCE: ocipizza
      JWT_JWKS_URL: http://user-service:8000/.well-known/jwks.json
    depends_on:
      nosql:
        condition: service_started
      object-storage:
        condition: service_started

  # Microserviço responsável pelo ciclo de vida dos usuários.
  # Persiste dados no MySQL e publica notificações no RabbitMQ
  # que serão processadas pelo notification-service.
  user-service:
    container_name: ocipizza-user-service
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    networks:
      - ocipizza-network
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO

      # Provider de persistência.
      PERSISTENCE_PROVIDER: sqlalchemy
      DATABASE_URL: mysql+pymysql://user_service:user_service@mysql:3306/users

      # Provider de mensageria utilizado pelo MessagePublisher.
      MESSAGING_PROVIDER: rabbitmq
      QUEUE_NAME: notifications-queue

      # Configurações de conexão com o RabbitMQ.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: oci_pizza
      RABBITMQ_PASSWORD: oci_pizza
      
      # Configurações utilizadas na geração e validação 
      # dos tokens JWT.
      JWT_KEY_PROVIDER: local
      JWT_ISSUER: user-service
      JWT_AUDIENCE: ocipizza
      JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: 15

      # Caminhos das chaves dentro do container.
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key.pem

      # Refresh token.
      REFRESH_TOKEN_EXPIRATION_DAYS: 30
    volumes:
      - ./services/user-service/secrets/jwt_private_key.pem:/run/secrets/jwt_private_key.pem:ro
      - ./services/user-service/secrets/jwt_public_key.pem:/run/secrets/jwt_public_key.pem:ro
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Microserviço responsável por validar a elegibilidade da entrega
  # e calcular a cotação com base no CEP informado.
  delivery-service:
    container_name: ocipizza-delivery-service
    build:
      context: ./services/delivery-service
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
    networks:
      - ocipizza-network
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO

      PERSISTENCE_PROVIDER: nosql

      NOSQL_ENDPOINT: http://nosql:8080
      NOSQL_TABLE_NAME: delivery_areas

      JWT_ISSUER: user-service
      JWT_AUDIENCE: ocipizza
      JWT_JWKS_URL: http://user-service:8000/.well-known/jwks.json
    depends_on:
      nosql:
        condition: service_started

  # Microserviço responsável por processar os pedidos, validar os valores
  # e coordenar o pagamento antes da confirmação do pedido.
  order-service:
    container_name: ocipizza-order-service
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    ports:
      - "8004:8000"
    networks:
      - ocipizza-network
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO

      PERSISTENCE_PROVIDER: nosql

      NOSQL_ENDPOINT: http://nosql:8080
      NOSQL_TABLE_NAME: orders

      JWT_ISSUER: user-service
      JWT_AUDIENCE: ocipizza
      JWT_JWKS_URL: http://user-service:8000/.well-known/jwks.json
    depends_on:
      nosql:
        condition: service_started

  # Worker responsável por consumir notificações do RabbitMQ e enviar
  # mensagens de e-mail pelo servidor SMTP configurado.
  notification-service:
    container_name: ocipizza-notification-service
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    networks:
      - ocipizza-network
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO

      SITE_URL: http://localhost:8010

      # Mensageria
      MESSAGING_PROVIDER: rabbitmq
      QUEUE_NAME: notifications-queue
  
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: oci_pizza
      RABBITMQ_PASSWORD: oci_pizza

      NOTIFICATION_POLL_INTERVAL: 1.0
      NOTIFICATION_RETRY_INTERVAL: 3.0

      # SMTP
      EMAIL_PROVIDER: smtp
      
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_USE_TLS: "false"
      SMTP_FROM_EMAIL: no-reply@ocipizza.local
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Microserviço responsável pela interface web da aplicação.
  frontend-service:
    container_name: ocipizza-frontend-service
    build:
      context: ./services/frontend-service
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    networks:
      - ocipizza-network
    environment:
        APP_ENV: development
        LOG_LEVEL: INFO

        PERSISTENCE_PROVIDER: redis

        REDIS_ENDPOINT: redis://redis:6379/0

        SESSION_SECRET_KEY: "!!!Sup3rS3cr3t0!!!"
        CSRF_SECRET_KEY: "!!!Sup3rS3cr3t0!!!"

        PIZZA_SERVICE_URL: http://pizza-service:8000
        USER_SERVICE_URL: http://user-service:8000
        DELIVERY_SERVICE_URL: http://delivery-service:8000
        ORDER_SERVICE_URL: http://order-service:8000
    depends_on:
      pizza-service:
        condition: service_started
      user-service:
        condition: service_started
      delivery-service:
        condition: service_started
      order-service:
        condition: service_started
      redis:
        condition: service_healthy

  # Banco de dados NoSQL utilizado pelos serviços da 
  # aplicação que necessitam de persistência orientada 
  # a documentos/chave-valor.
  nosql:
    container_name: ocipizza-nosql
    image: ghcr.io/oracle/nosql:latest-ce
    ports:
      - "18080:8080"
    networks:
      - ocipizza-network
    environment:
      KV_PROXY_PORT: 8080
      KV_STORAGESIZE: 1    
    volumes:
      - nosql-data:/oci-nosql-data

  # Serviço utilizado para armazenamento de imagens da 
  # aplicação.
  object-storage:
    container_name: ocipizza-object-storage
    image: ghcr.io/coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - ocipizza-network
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - object-storage-data:/data

  # Banco de dados relacional MySQL.
  # https://container-registry.oracle.com/ords/ocr/ba/mysql/community-server 
  mysql:
    container_name: ocipizza-mysql
    image: container-registry.oracle.com/mysql/community-server:8.4
    ports:
      - "13306:3306"
    networks:
      - ocipizza-network
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Broker RabbitMQ utilizado pelos serviços da aplicação 
  # para troca assíncrona de mensagens e processamento 
  # desacoplado de eventos.
  rabbitmq:
    container_name: ocipizza-rabbitmq
    image: rabbitmq:4.1.4-management
    ports:
      # Porta utilizada pelos clientes AMQP.
      - '5672:5672'

      # Interface web de administração do RabbitMQ.
      - '15672:15672'
    networks:
      - ocipizza-network
    environment:
      RABBITMQ_DEFAULT_USER: oci_pizza
      RABBITMQ_DEFAULT_PASS: oci_pizza
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - check_running
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Serviço de cache e armazenamento temporário 
  # utilizado para gerenciar sessões e dados transitórios 
  # da aplicação.
  redis:
    image: redis:7.0
    container_name: ocipizza-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    networks:
      - ocipizza-network
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
  
  # Servidor SMTP utilizado para capturar e visualizar e-mails
  # enviados pelos microsserviços durante o desenvolvimento.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ocipizza-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - ocipizza-network
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data

# Rede utilizada para permitir a comunicação entre os 
# containers que compõem a aplicação OCI-PIZZA.
networks:
  ocipizza-network:
    driver: bridge

# Volumes persistentes utilizados pelos serviços para 
# preservar dados mesmo após a remoção ou recriação dos 
# containers.
volumes:
  mysql-data:
  nosql-data:
  object-storage-data:
  rabbitmq-data:
  mailpit-data:
