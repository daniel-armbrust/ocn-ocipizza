services:

  pizza-service:
    container_name: oci-pizza-pizza-service
    build:
      context: ./services/pizza-service
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    networks:
      - oci-pizza-network
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO

      OCI_REGION: sa-saopaulo-1

      OCI_NOSQL_ENDPOINT: http://nosql:8080
      OCI_NOSQL_TABLE: pizzas
      OCI_NOSQL_COMPARTMENT_ID: ""
      OCI_CONFIG_FILE: /home/appuser/.oci/config
      OCI_CONFIG_PROFILE: DEFAULT

      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_BUCKET: pizza-images

      AUTH_SERVICE_URL: http://auth-service:8000
      PIZZA_SERVICE_ADMIN_TOKEN: admin-token
    depends_on:
      - nosql
      - object-storage
    volumes:
      - ${HOME}/.oci:/home/appuser/.oci:ro

  nosql:
    container_name: oci-pizza-nosql
    image: ghcr.io/oracle/nosql:latest-ce
    ports:
      - "18080:8080"
    networks:
      - oci-pizza-network
    environment:
      KV_PROXY_PORT: 8080
      KV_STORAGESIZE: 1    
    volumes:
      - nosql-data:/oci-nosql-data

  object-storage:
    container_name: oci-pizza-object-storage
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - oci-pizza-network
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - object-storage-data:/data

  seed:
    container_name: oci-pizza-seed
    image: python:3.11.10-slim-bookworm
    working_dir: /app
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      ENVIRONMENT: development
      OCI_REGION: sa-saopaulo-1
      OCI_NOSQL_ENDPOINT: http://nosql:8080
      OCI_NOSQL_TABLE: pizzas
      OCI_NOSQL_COMPARTMENT_ID: ""
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_BUCKET: pizza-images
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
    depends_on:
      - nosql
      - object-storage
    networks:
      - oci-pizza-network
    volumes:
      - ./seed:/app/seed:ro
    command:
      - sh
      - -c
      - |
        pip install --no-cache-dir -r seed/requirements.txt
        python seed/wait-for-infrastructure.py
        python seed/run-seed.py

networks:
  oci-pizza-network:
    driver: bridge

volumes:
  nosql-data:
  object-storage-data:
